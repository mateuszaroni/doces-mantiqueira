[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Portão 2: troque para "true" quando o domínio próprio entrar (tira o noindex e gera o sitemap).
  PUBLIC_INDEXAVEL = "false"

# Arquivos com hash no nome nunca mudam: cache longo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
